name: Build and verify Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify, lint and build installable test APK
        run: bash gradlew :sensor-core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Verify APK signature and checksum
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Watch-Test-0.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/Watch-Test-0.1.0.apk
          cd artifacts
          sha256sum Watch-Test-0.1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Watch-Test-APK
          path: artifacts/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-test-reports
          path: |
            sensor-core/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 14
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            bash gradlew :app:connectedDebugAndroidTest --console=plain
            adb pull /sdcard/Android/data/com.marc.watchtest/files/screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Emulator-${{ matrix.api }}-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
          retention-days: 14
