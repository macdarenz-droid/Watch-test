<style>
/* Layout: one phone-width how-to sheet (the app's bottom sheet), stage on top, cue, transport, tempo, chips. */
:root {
  /* Silent Black, the app's default theme (src/theme/themes.ts) */
  --bg: #08090a;
  --surface-1: #0f1011;
  --surface-2: #141516;
  --surface-3: #1b1c1f;
  --border-subtle: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.18);
  --text: #f7f8f8;
  --text-2: #8a8f98;
  --text-3: #62666d;
  --accent: #5e6ad2;
  --accent-soft: rgba(94,106,210,0.16);
  --on-accent: #ffffff;
  --mistake: #eb5757;
  --mistake-soft: rgba(235,87,87,0.14);
  --figure: #b4b7bf;
  --rim: #8f98ff;
  --dot: rgba(255,255,255,0.075);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 22px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    /* Paper */
    --bg: #ffffff; --surface-1: #f7f6f3; --surface-2: #efeeea; --surface-3: #e6e4df;
    --border-subtle: rgba(55,53,47,0.08); --border: rgba(55,53,47,0.14); --border-strong: rgba(55,53,47,0.26);
    --text: #37352f; --text-2: #5f5e5a; --text-3: #9b9a97;
    --accent: #2383e2; --accent-soft: rgba(35,131,226,0.12); --on-accent: #ffffff;
    --mistake: #c0392b; --mistake-soft: rgba(192,57,43,0.10);
    --figure: #c9cbcf; --rim: #9fc6f2; --dot: rgba(55,53,47,0.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --surface-1: #f7f6f3; --surface-2: #efeeea; --surface-3: #e6e4df;
  --border-subtle: rgba(55,53,47,0.08); --border: rgba(55,53,47,0.14); --border-strong: rgba(55,53,47,0.26);
  --text: #37352f; --text-2: #5f5e5a; --text-3: #9b9a97;
  --accent: #2383e2; --accent-soft: rgba(35,131,226,0.12); --on-accent: #ffffff;
  --mistake: #c0392b; --mistake-soft: rgba(192,57,43,0.10);
  --figure: #c9cbcf; --rim: #9fc6f2; --dot: rgba(55,53,47,0.10);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: 452px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 32px;
  display: grid;
  gap: 16px;
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand b { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.brand b i { font-style: normal; color: var(--accent); }
.brand span { color: var(--text-2); font-size: 15px; }

.sheet {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 10px 16px 18px;
  display: grid;
  gap: 14px;
  min-width: 0;
}
.grab { width: 36px; height: 4px; border-radius: 4px; background: var(--border-strong); justify-self: center; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eyebrow { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }
.head h1 { margin: 2px 0 0; font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.icon-btn {
  width: 44px; height: 44px; margin: -6px -10px 0 0;
  border: 0; background: none; color: var(--text-2);
  display: grid; place-items: center; border-radius: 50%; cursor: pointer;
}
.icon-btn:hover { color: var(--text); }

/* Stage */
.stage {
  position: relative;
  aspect-ratio: 1 / 1.02;
  max-width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  background-color: var(--surface-2);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.6px);
  background-size: 16px 16px;
  background-position: 8px 8px;
  touch-action: pan-y;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 160ms ease; }
.stage canvas.fading { opacity: 0; }
.stage svg.ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.view-label { position: absolute; left: 14px; top: 11px; font-size: 13px; font-weight: 500; color: var(--text-2); }
.tag {
  position: absolute; right: 10px; top: 32px; max-width: 38%;
  font-size: 12px; font-weight: 600; line-height: 1.3;
  color: var(--accent); padding: 5px 9px; border-radius: 8px;
  background: color-mix(in srgb, var(--surface-2) 70%, transparent);
}
.tag.boxed { border: 1px solid currentColor; }
.tag.m { color: var(--mistake); background: color-mix(in srgb, var(--mistake-soft) 60%, var(--surface-2)); }
.bottom-ui { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; }
.pill {
  font-size: 13px; font-weight: 600; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 999px; padding: 4px 16px;
  background: color-mix(in srgb, var(--surface-2) 80%, transparent);
  min-width: 76px; text-align: center;
}
.seg { display: flex; padding: 3px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); }
.seg button {
  font: 600 13px/1 var(--font); color: var(--text-2);
  min-height: 36px; min-width: 112px; padding: 0 18px;
  border: 0; border-radius: 999px; background: none; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg button.m[aria-pressed="true"] { background: var(--mistake); }
.locator { position: absolute; right: 12px; top: 12px; width: 64px; height: 108px; }
.status {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
  color: var(--text-2); font-size: 14px;
}

/* Cue */
.cue { min-height: 50px; }
.cue p { margin: 0; }
.cue .line { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.cue .sub { color: var(--text-2); font-size: 14.5px; margin-top: 2px; }

/* Transport */
.transport { display: flex; align-items: center; gap: 12px; }
.play {
  width: 60px; height: 60px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: var(--on-accent); display: grid; place-items: center;
}
.round {
  height: 46px; min-width: 64px; padding: 0 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border-strong); background: none; color: var(--text);
  font: 600 14px/1 var(--font); display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
}
.round:hover, .chip:hover { border-color: var(--text-3); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Tempo strip */
.tempo { display: grid; gap: 8px; }
.bar { position: relative; display: flex; gap: 6px; height: 22px; align-items: center; cursor: pointer; touch-action: none; }
.bar .s { position: relative; height: 5px; border-radius: 4px; background: var(--border-strong); overflow: hidden; }
.bar .s.move { background: color-mix(in srgb, var(--accent) 38%, var(--border)); }
.bar .s i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
.knob {
  position: absolute; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
  background: var(--text); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent);
  left: 0; pointer-events: none;
}
.labels { display: flex; gap: 6px; }
.labels div { min-width: 0; font-variant-numeric: tabular-nums; }
.labels b { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); }
.labels span { font-size: 14px; color: var(--text); }
.labels .on b { color: var(--accent); }

/* Chips */
.chips { display: flex; gap: 6px; }
.chip {
  flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 0 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border-strong); background: none; color: var(--text-2);
  font: 600 13px/1 var(--font);
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip.m[aria-pressed="true"] { background: var(--mistake); border-color: var(--mistake); }

.note { margin: 0; color: var(--text-3); font-size: 12.5px; max-width: 60ch; }

@media (prefers-reduced-motion: reduce) {
  .stage canvas { transition: none; }
}
</style>

<div class="page">

      <svg class="locator" id="locator" viewBox="0 0 64 108" hidden aria-hidden="true">
        <g fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.85">
          <circle cx="32" cy="10" r="6"/>
          <path d="M24 20 Q32 18 40 20 L42 50 Q36 54 32 54 Q28 54 22 50 Z"/>

        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.2 7.2A6.5 6.5 0 1 1 3.5 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3.6 3.4v4.2h4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>

  </main>

  <p class="note">Figure and grip models made with Meshy (text to 3D, auto-rig). Pose, timing and cues come from the app's lateral raise data: lift 1 s, hold 0.5 s, lower 2 s, rest 0.5 s.</p>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ---------- Exercise data (from src/howto/generated/ht-dumbbell-lateral-raise.ts) ---------- */
const TEMPO = [
  { k: 'lift', label: 'Lift', d: 1, move: true },
  { k: 'hold', label: 'Hold', d: 0.5 },
  { k: 'lower', label: 'Lower', d: 2, move: true },
  { k: 'rest', label: 'Rest', d: 0.5 },
];
const CYCLE = TEMPO.reduce((a, p) => a + p.d, 0);
const COPY = {
  movement: { view: 'Front', tag: 'Elbows lead', cue: { lift: 'Elbows lead. Hands follow.', hold: 'Stop at shoulder height.', lower: 'Lower for two seconds.', rest: 'Arms by your thighs.' } },
  grip: { view: 'Grip', line: 'Wrist straight. Handle mid-palm.', sub: 'Little finger no higher than the thumb.' },
  posture: {
    view: 'Front',
    form: { tag: 'No shrug', line: 'Shoulders stay down.', sub: 'The upper traps stay quiet.' },
    mistake: { tag: 'Shoulders raise toward ears', line: 'Keep the shoulders down.', sub: 'Go lighter. Keep the body still.' },
  },
  feel: { view: 'Front', tag: 'Side shoulders', line: 'Outside of the shoulders.', sub: 'If your neck takes over, go lighter.' },
};

/* ---------- Small helpers ---------- */
const $ = (id) => document.getElementById(id);
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const lerp = (a, b, t) => a + (b - a) * t;
const DEG = Math.PI / 180;
const minJerk = (x) => { x = clamp01(x); return x * x * x * (10 + x * (-15 + 6 * x)); };
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
function phaseAt(t) {
  let a = 0;
  for (const p of TEMPO) { if (t < a + p.d) return { p, u: (t - a) / p.d, start: a }; a += p.d; }
  return { p: TEMPO[TEMPO.length - 1], u: 1, start: CYCLE - TEMPO[TEMPO.length - 1].d };
}
function liftAt(t) {
  const { p, u } = phaseAt(t);
  return p.k === 'lift' ? minJerk(u) : p.k === 'hold' ? 1 : p.k === 'lower' ? 1 - minJerk(u) : 0;
}
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- State ---------- */
const state = {
  mode: 'movement',
  mistake: false,
  playing: !reduceMotion,
  speed: 0.5,
  t: reduceMotion ? 1.25 : 0,
};

/* ---------- Tempo strip ---------- */
const bar = $('bar'), labels = $('labels');
const segEls = TEMPO.map((p) => {
  const s = document.createElement('div');
  s.className = 's' + (p.move ? ' move' : '');
  s.style.flex = `${p.d} 1 0`;
  s.appendChild(document.createElement('i'));
  bar.appendChild(s);
  const l = document.createElement('div');
  l.style.flex = `${p.d} 1 0`;
  l.innerHTML = `<b>${p.label}</b><span>${p.d} s</span>`;
  labels.appendChild(l);
  return { s, fill: s.firstChild, l };
});
const knob = document.createElement('span');
knob.className = 'knob';
bar.appendChild(knob);

function renderTempo() {
  const { p, u } = phaseAt(state.t);
  const idx = TEMPO.indexOf(p);
  segEls.forEach((e, i) => {
    e.fill.style.width = i < idx ? '100%' : i === idx ? `${u * 100}%` : '0%';
    e.l.classList.toggle('on', i === idx);
  });
  const s = segEls[idx].s;
  knob.style.left = `${s.offsetLeft + u * s.offsetWidth}px`;
  bar.setAttribute('aria-valuenow', state.t.toFixed(2));
  bar.setAttribute('aria-valuetext', `${p.label}, ${state.t.toFixed(1)} of ${CYCLE} seconds`);
}
function timeFromX(clientX) {
  const x = clientX - bar.getBoundingClientRect().left;
  let acc = 0;
  for (let i = 0; i < segEls.length; i++) {
    const s = segEls[i].s;
    if (x <= s.offsetLeft + s.offsetWidth || i === segEls.length - 1) {
      return acc + clamp01((x - s.offsetLeft) / s.offsetWidth) * TEMPO[i].d;
    }
    acc += TEMPO[i].d;
  }
  return 0;
}
let scrubbing = false;
bar.addEventListener('pointerdown', (e) => { scrubbing = true; bar.setPointerCapture(e.pointerId); setPlaying(false); state.t = timeFromX(e.clientX); });
bar.addEventListener('pointermove', (e) => { if (scrubbing) state.t = timeFromX(e.clientX); });
bar.addEventListener('pointerup', () => { scrubbing = false; });
bar.addEventListener('pointercancel', () => { scrubbing = false; });
bar.addEventListener('keydown', (e) => {
  const step = e.key === 'ArrowRight' ? 0.25 : e.key === 'ArrowLeft' ? -0.25 : 0;
  if (!step) return;
  e.preventDefault(); setPlaying(false);
  state.t = (state.t + step + CYCLE) % CYCLE;
});

/* ---------- Transport ---------- */
const PLAY_PATH = 'M6 3.5v15l12.5-7.5z';
const PAUSE_PATH = 'M5.5 3.5h4v15h-4zM12.5 3.5h4v15h-4z';
function setPlaying(on) {
  state.playing = on;
  $('play').setAttribute('aria-label', on ? 'Pause' : 'Play');
  $('play-icon').firstElementChild.setAttribute('d', on ? PAUSE_PATH : PLAY_PATH);
}
$('play').addEventListener('click', () => setPlaying(!state.playing));
$('replay').addEventListener('click', () => { state.t = 0; setPlaying(true); });
$('speed').addEventListener('click', () => {
  state.speed = state.speed === 0.5 ? 1 : 0.5;
  $('speed').textContent = `${state.speed}x`;
});
$('close').addEventListener('click', () => { setPlaying(false); });
setPlaying(state.playing);

/* ---------- Chips and Form/Mistake ---------- */
document.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('seg-form').addEventListener('click', () => setMistake(false));
$('seg-mistake').addEventListener('click', () => setMistake(true));
function setMistake(on) {
  state.mistake = on;
  $('seg-form').setAttribute('aria-pressed', String(!on));
  $('seg-mistake').setAttribute('aria-pressed', String(on));
  document.querySelector('.chip[data-mode="posture"]').classList.toggle('m', on);
  syncCopy(true);
}

/* ---------- Three.js scene ---------- */
const stage = $('stage'), canvas = $('gl'), ov = $('ov');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.02, 30);

const hemi = new THREE.HemisphereLight(0xe8ebff, 0x1a1b1f, 1.15);
const key = new THREE.DirectionalLight(0xffffff, 2.3); key.position.set(1.6, 3.2, 3.4);
const fill = new THREE.DirectionalLight(0xffffff, 0.55); fill.position.set(-2.4, 1.2, 2.6);
const rim = new THREE.DirectionalLight(0x8f98ff, 2.0); rim.position.set(-2.2, 2.4, -2.6);
const rim2 = new THREE.DirectionalLight(0x8f98ff, 1.2); rim2.position.set(2.4, 1.8, -2.2);
scene.add(hemi, key, fill, rim, rim2);

/* Dotted floor that fades with distance, and a soft contact shadow. */
const floor = (() => {
  const pts = [], cols = [];
  for (let x = -1.6; x <= 1.6001; x += 0.1) for (let z = -1.4; z <= 1.2001; z += 0.1) {
    pts.push(x, 0, z);
    const f = clamp01(1 - Math.hypot(x / 1.6, z / 1.3));
    cols.push(1, 1, 1, f * f);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 4));
  const m = new THREE.PointsMaterial({ size: 2.2, sizeAttenuation: false, vertexColors: true, transparent: true, depthWrite: false });
  return new THREE.Points(g, m);
})();
const shadow = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(64, 64, 4, 64, 64, 64);
  gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  const m = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.55), m);
  mesh.rotation.x = -Math.PI / 2; mesh.position.y = 0.002;
  return mesh;
})();
scene.add(floor, shadow);

/* Shared uniforms for the muscle shimmer and the clay tint. */
const U = {
  uFigure: { value: new THREE.Color() },
  uAccent: { value: new THREE.Color() },

    const bin = atob(tag.textContent.trim()), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return Promise.resolve(u8.buffer);
  }
  return fetch(name + '.glb').then((r) => { if (!r.ok) throw new Error(`${name}.glb: ${r.status}`); return r.arrayBuffer(); });
}
const loader = new GLTFLoader();
const loadModel = (name) => modelBytes(name).then((buf) => loader.parseAsync(buf, ''));
loadModel('figure').then((g) => {
  setupFigure(g);
  resize();
  camera.position.copy(view.pos);
  $('status').hidden = true;
  return loadModel('hand').then(setupHand);
}).catch((err) => {
  console.error(err);
  $('status').textContent = "The 3D figure didn't load. Reload the page to try again.";
  $('status').hidden = false;
});
requestAnimationFrame(frame);
</script>
